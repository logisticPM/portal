<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 402" font-family="'Helvetica Neue',Arial,sans-serif">
  <!-- Golden-match rate by number of sources agreeing (E1, injected ground truth) — Fig 2 -->
  <!-- y: v% -> 350 - v*3 ; plot 0..100 over y 350..50 -->
  <g stroke="#C4CCBD" stroke-width="1">
    <line x1="60" y1="350" x2="660" y2="350"/>
    <line x1="60" y1="275" x2="660" y2="275"/>
    <line x1="60" y1="200" x2="660" y2="200"/>
    <line x1="60" y1="125" x2="660" y2="125"/>
    <line x1="60" y1="50"  x2="660" y2="50"/>
  </g>
  <g font-family="'SF Mono',Menlo,monospace" font-size="15" fill="#7C8A81" text-anchor="end">
    <text x="52" y="355">0</text>
    <text x="52" y="280">25</text>
    <text x="52" y="205">50</text>
    <text x="52" y="130">75</text>
    <text x="52" y="55">100%</text>
  </g>

  <!-- legend -->
  <rect x="70" y="60" width="18" height="18" fill="#C4CCBD"/>
  <text x="94" y="75" font-size="15" fill="#57665D">same model &#215;3 runs</text>
  <rect x="240" y="60" width="18" height="18" fill="#2C5F82"/>
  <text x="264" y="75" font-size="15" fill="#57665D">cross-family &#215;3 (independent)</text>

  <!-- depth 1 (center 160) -->
  <rect x="96"  y="308" width="60" height="42"  fill="#C4CCBD"/>
  <rect x="164" y="266" width="60" height="84"  fill="#2C5F82"/>
  <text x="126" y="300" font-size="16" fill="#16201B" text-anchor="middle">14%</text>
  <text x="194" y="258" font-size="16" fill="#16201B" text-anchor="middle">28%</text>

  <!-- depth 2 (center 360) -->
  <rect x="296" y="299" width="60" height="51"  fill="#C4CCBD"/>
  <rect x="364" y="197" width="60" height="153" fill="#2C5F82"/>
  <text x="326" y="291" font-size="16" fill="#16201B" text-anchor="middle">17%</text>
  <text x="394" y="189" font-size="16" fill="#16201B" text-anchor="middle">51%</text>

  <!-- depth 3 (center 560) — the headline -->
  <rect x="496" y="188" width="60" height="162" fill="#C4CCBD"/>
  <rect x="564" y="83"  width="60" height="267" fill="#2C5F82"/>
  <text x="526" y="180" font-size="18" font-weight="700" fill="#16201B" text-anchor="middle">54%</text>
  <text x="594" y="75"  font-size="22" font-weight="800" fill="#2C5F82" text-anchor="middle">89%</text>

  <!-- +35 pts gap bracket at depth 3 -->
  <line x1="642" y1="83" x2="642" y2="188" stroke="#8A1A2B" stroke-width="2"/>
  <line x1="637" y1="83"  x2="647" y2="83"  stroke="#8A1A2B" stroke-width="2"/>
  <line x1="637" y1="188" x2="647" y2="188" stroke="#8A1A2B" stroke-width="2"/>
  <text x="652" y="139" font-size="16" font-weight="700" fill="#8A1A2B">+35 pts</text>

  <!-- x labels -->
  <g font-size="17" fill="#16201B" text-anchor="middle">
    <text x="160" y="375">1 source</text>
    <text x="360" y="375">2 sources</text>
    <text x="560" y="375">3 sources</text>
  </g>
  <text x="360" y="400" font-size="16" fill="#57665D" text-anchor="middle">sources agreeing on a finding</text>
</svg>
